<title>Gili — Prospectos</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #E2999B; --rose-dark: #C97A7D; --dark: #1A1A18;
    --warm-white: #FAF8F4; --muted: #8A8580; --border: #E5E0D8;
    --success: #4B7A5B; --error: #B84A4A; --warn: #B8863A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--warm-white); color: var(--dark);
    font-family: 'Instrument Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 840px; margin: 0 auto; padding: 32px 20px 80px; }
  .back { display: inline-block; color: var(--muted); font-size: 13px; text-decoration: none; margin-bottom: 16px; }
  .back:hover { color: var(--dark); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .logo { font-family: 'DM Serif Display', serif; font-size: 24px; }
  .logo span { color: var(--rose); }
  h1 { font-family: 'DM Serif Display', serif; font-size: 20px; font-weight: 400; margin: 4px 0 0; }
  .searchWrap { position: relative; margin-bottom: 20px; }
  .searchIcon { position: absolute; top: 50%; left: 14px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  #searchInput {
    width: 100%; padding: 12px 14px 12px 44px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 15px; font-family: inherit; color: var(--dark); background: #fff;
  }
  #searchInput:focus { outline: 2px solid var(--rose); outline-offset: 1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; cursor: pointer; transition: border-color 0.15s ease;
  }
  .card:hover { border-color: var(--rose); }
  .card-name { font-family: 'DM Serif Display', serif; font-size: 17px; margin: 0 0 2px; }
  .card-fullname { font-size: 12px; color: var(--muted); margin: 0 0 10px; line-height: 1.4; }
  .card-row { font-size: 13px; margin-bottom: 5px; display: flex; gap: 6px; }
  .card-row .k { color: var(--muted); flex-shrink: 0; min-width: 60px; }
  .card-row .v { word-break: break-word; }
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 500; background: var(--warm-white); color: var(--muted);
  }
  .pill.followup { background: #fbf3e6; color: var(--warn); }
  .pill.notinterested, .pill.invalid { background: #fbecec; color: var(--error); }
  .pill.new { background: #eef5ef; color: var(--success); }
  .card-notes {
    font-size: 12px; color: var(--muted); margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border); font-style: italic;
  }
  .empty, .loading, .error { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; grid-column: 1 / -1; }
</style>
</head>

  function statusPill(status) {
    const s = (status || '').toLowerCase();
    if (s.includes('followup')) return `<span class="pill followup">${status}</span>`;
    if (s.includes('not interested') || s.includes('invalid')) return `<span class="pill notinterested">${status}</span>`;
    if (!s || s === '-') return `<span class="pill new">Sin contacto</span>`;
    return `<span class="pill">${status}</span>`;
  }

  function firstPhone(phone) {
    if (!phone) return '';
    return phone.split(',')[0].trim().replace(/[^\d]/g, '');
  }

  function statusPriority(status) {
    const s = (status || '').toLowerCase().trim();
    if (s.includes('followup')) return 0;
    if (s.includes("didn't pick up") || s.includes('no answer')) return 1;
    if (!s || s === '-') return 2;
    if (s.includes('not interested') || s.includes('invalid')) return 4;
    return 3; // any other status (e.g. Redirect, Closed, Other)
  }

  function stableId(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
    }
    return 'es-' + Math.abs(hash).toString(36);
  }

  function render(list) {
    if (!list.length) {
      grid.innerHTML = '<div class="empty">Sin resultados</div>';
      return;
    }
    const sorted = [...list].sort((a, b) => statusPriority(a.status) - statusPriority(b.status));
    grid.innerHTML = sorted.map(p => {
      const phoneDigits = firstPhone(p.phone);
      const leadId = stableId(p.domain || p.phone || p.name || '');
      const params = new URLSearchParams({ id: leadId, salonName: p.fullName || p.name || '' });
      if (phoneDigits) params.set('whatsapp', phoneDigits);
      if (p.city) params.set('city', p.city);
      const href = `lead.html?${params.toString()}`;
      return `
        <div class="card" onclick="location.href='${href}'">
          <div class="card-name">${p.name || ''}</div>
          <div class="card-fullname">${p.fullName || ''}</div>
          <div class="card-row"><span class="k">Teléfono</span><span class="v">${p.phone || '—'}</span></div>
          <div class="card-row"><span class="k">Último contacto</span><span class="v">${p.lastCallDate || '—'}</span></div>
          <div class="card-row"><span class="k">Sitio web</span><span class="v">${p.domain || '—'}</span></div>
          <div class="card-row">${statusPill(p.status)}</div>
          ${p.followupTodo ? `<div class="card-row"><span class="k">Seguimiento</span><span class="v">${p.followupTodo}</span></div>` : ''}
          ${p.notes ? `<div class="card-notes">${p.notes}</div>` : ''}
        </div>`;
    }).join('');
  }

  searchInput.addEventListener('input', applyFilters);

  const statusFilter = document.getElementById('statusFilter');
  statusFilter.addEventListener('change', applyFilters);

  function applyFilters() {
    const term = searchInput.value.trim().toLowerCase();
    const status = statusFilter.value;
    let filtered = prospects;
    if (status) {
      filtered = filtered.filter(p => (p.status || '').trim() === status);
    }
    if (term) {
      filtered = filtered.filter(p =>
        (p.name || '').toLowerCase().includes(term) ||
        (p.fullName || '').toLowerCase().includes(term)
      );
    }
    render(filtered);
  }
